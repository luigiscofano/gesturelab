<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">GestureLab — visão computacional, na prática</title>
  <desc id="description">Capa do projeto com ilustrações esquemáticas de pontos de uma mão, um traço no ar e uma pose corporal. Quatro modos: hands, gestures, airwrite e posematch.</desc>
