name: Python checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pure-test dependencies
        run: python -m pip install pytest==9.2.0 ruff==0.17.3
      - name: Lint
        run: python -m ruff check .
      - name: Compile Python sources
        run: python -m compileall -q app.py core.py airwriting.py file_io.py pose_matching.py pose_match_app.py pose_gallery scripts tests
      - name: Check CLI entry points without vision dependencies
        run: |
          python app.py --help
          python scripts/download_models.py --help
          python scripts/check_environment.py --help
          python scripts/build_pose_catalog.py --help
      - name: Test deterministic logic
        run: python -m pytest -q

# Estes testes não usam webcam nem baixam modelos. A validação de visão é local.
