name: Python checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pure-test dependencies
        run: python -m pip install pytest==9.2.0 ruff==0.17.3
      - name: Lint
        run: python -m ruff check .
      - name: Test deterministic logic
        run: python -m pytest -q

# Estes testes não usam webcam nem baixam modelos. A validação de visão é local.
